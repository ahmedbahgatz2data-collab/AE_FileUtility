name: Build and Release AE_FileUtility

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'app.py'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version from app.py
        id: version
        shell: pwsh
        run: |
          $content = Get-Content -Path "app.py" -Raw
          if ($content -match 'CURRENT_VERSION\s*=\s*"([^"]+)"') {
            $ver = $matches[1].Trim()
            if (-not $ver.StartsWith("v") -and -not $ver.StartsWith("V")) {
              $tag = "v$ver"
            } else {
              $tag = $ver
            }
            "tag=$tag" >> $env:GITHUB_OUTPUT
            "release_name=AE_FileUtility $tag" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not find CURRENT_VERSION in app.py"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tkinterdnd2 pillow

      - name: Ensure Multi-Size ICO Format
        shell: python
        run: |
          import os
          from PIL import Image

          icon_path = "icon.ico"
          if os.path.exists(icon_path):
              try:
                  with Image.open(icon_path) as img:
                      rgba = img.convert("RGBA")
                      rgba.save(
                          icon_path,
                          format="ICO",
                          sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)],
                      )
                      print("Saved multi-size icon.ico successfully.")
              except Exception as e:
                  print(f"Icon processing warning: {e}")

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --collect-all tkinterdnd2 --icon=icon.ico --name="AE_FileUtility" app.py

      - name: Create or Update Release and Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          files: dist/AE_FileUtility.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
