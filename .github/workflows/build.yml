name: Build and Release AE_FileUtility

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'app.py'  # يتم تشغيل البناء فقط عند تعديل ملف البايثون

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write  # صلاحية كتابة ونشر الإصدارات (Releases) تلقائياً

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller & Requests
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name="AE_FileUtility" app.py

    - name: Create Release and Upload EXE
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0
        name: AE_FileUtility v1.1.0
        files: dist/AE_FileUtility.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
