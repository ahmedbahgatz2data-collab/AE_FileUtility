name: Build and Release AE_FileUtility

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'app.py'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version from app.py
        id: version
        shell: pwsh
        run: |
          $content = Get-Content -Path "app.py" -Raw
          if ($content -match 'CURRENT_VERSION\s*=\s*"([^"]+)"') {
            $ver = $matches[1].Trim()
            if (-not $ver.StartsWith("v") -and -not $ver.StartsWith("V")) {
              $tag = "v$ver"
            } else {
              $tag = $ver
            }
            "tag=$tag" >> $env:GITHUB_OUTPUT
            "release_name=AE_FileUtility $tag" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not find CURRENT_VERSION in app.py"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name="AE_FileUtility" app.py

      - name: Create or Update Release and Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          files: dist/AE_FileUtility.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
